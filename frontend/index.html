<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miguel Cinema</title>


<link rel="stylesheet" href="./style.css">

<!-- Font Awesome CDN Link -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
>


</head>

<body>


<!-- Header Section Starts Here -->
<header>
    <div class="logo">
        <img src="./images/JioCinema Logo.png" alt="JioCinema Logo">
        <p>Miguel Cinema</p>
    </div>

    <div class="header-controls">

        <!-- Authentication controls -->
        <div class="account-controls">

            <!-- Shown when logged out -->
            <button id="login-btn" type="button">
                Login
            </button>

            <!-- Shown when logged in -->
            <div id="user-controls" style="display: none;">
                <span id="username-display"></span>
                <button id="logout-btn" type="button">
                    Logout
                </button>
            </div>

        </div>

        <!-- Theme controls -->
        <div class="theme-mode-btns">
            <i class="fa-solid fa-toggle-on dark-mode"></i>
            <i class="fa-solid fa-toggle-off light-mode"></i>
        </div>

    </div>
</header>
<!-- Header Section Ends Here -->


<!-- Authentication Panel Starts Here -->
<section
    id="auth-panel"
    class="auth-panel"
    style="display: none;"
>
    <div class="auth-panel-content">

        <div class="auth-tabs">
            <button
                id="show-login-btn"
                type="button"
                class="active"
            >
                Login
            </button>

            <button
                id="show-register-btn"
                type="button"
            >
                Novo Usuario
            </button>
        </div>


        <!-- Login Form -->
        <form id="login-form">

            <div class="auth-field">
                <label for="login-username">
                    Nome de Usuario ou Email
                </label>

                <input
                    id="login-username"
                    type="text"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="auth-field">
                <label for="login-password">
                    Senha
                </label>

                <input
                    id="login-password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

            <p id="login-message" class="auth-message"></p>

        </form>


        <!-- Registration Form -->
        <form
            id="register-form"
            style="display: none;"
        >

            <div class="auth-field">
                <label for="register-username">
                    Nome de Usuario
                </label>

                <input
                    id="register-username"
                    type="text"
                    autocomplete="username"
                    minlength="3"
                    maxlength="30"
                    required
                >
            </div>

            <div class="auth-field">
                <label for="register-email">
                    Email
                </label>

                <input
                    id="register-email"
                    type="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="auth-field">
                <label for="register-password">
                    Senha
                </label>

                <input
                    id="register-password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="128"
                    required
                >
            </div>

            <button type="submit">
                Novo Usuario
            </button>

            <p id="register-message" class="auth-message"></p>

        </form>

    </div>
</section>
<!-- Authentication Panel Ends Here -->


<!-- Input Section Starts Here -->
<div class="input-field">
    <input
        type="text"
        placeholder="Insira o Nome do Filme ..."
    >

    <div class="search-movie-list-container">
    </div>
</div>
<!-- Input Section Ends Here -->


<!-- Movie Container Section Starts Here -->
<main>
    <section>

        <div class="movie-container">

            <div class="movie-details-container">

                <div class="movie-image">
                    <img
                        src="https://image.tmdb.org/t/p/original/zB7zJQgk4pPoxsPzZP0CqUgHuXN.jpg"
                        alt="Movie Image"
                    >
                </div>

                <div class="movie-details">

                    <div class="movie-heading">
                        <h1 class="movie-name"></h1>
                    </div>

                    <p class="movie-original-name">
                        Título Original:
                        <span></span>
                    </p>

                    <div class="genres">
                        <p>Gênero:</p>
                        <ul class="genres-list"></ul>
                    </div>

                    <p class="ratings">
                        Nota:
                        <span>7</span>
                    </p>

                    <p class="description"></p>

                </div>
            </div>


            <div class="cast-details-container">

                <h1>Cast</h1>

                <div class="cast-details">
                </div>

            </div>

        </div>

    </section>
</main>
<!-- Movie Container Section Ends Here -->


<!-- Scripts Goes Here -->
<script src="./script.js" defer></script>


</body>
</html>
